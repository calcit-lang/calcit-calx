on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: calcit-lang/setup-calcit@v1.3.0
        with:
          version: "0.13.57"
          tools: calcit,caps

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_calx.so)"
          grep -q ' calcit_ffi_buffer_free$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' run_vm_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|run_vm)$' <<<"$exports"

      - run: caps --strict --ci

      - run: calcit calcit.cirru --check-only

      - run: mkdir -p dylibs/

      - run: cp target/release/libcalcit_calx.so dylibs/

      - run: calcit --trace-ffi calcit.cirru
